name: Marvel OS refresh

# Keeps the Neon source of truth current, independent of any laptop.
# Pulls new HubSpot call AI-summaries (and refreshes deals/contacts) into Neon.
# Secrets live in GitHub (Settings > Secrets > Actions), never in the code.

on:
  schedule:
    - cron: "0 7 * * *"      # every day at 07:00 UTC (adjust as needed)
  workflow_dispatch: {}       # allow a manual run from the Actions tab

permissions:
  contents: read              # minimal; the job only reads the repo

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install psycopg2-binary anthropic

      - name: Ingest new HubSpot call summaries -> Neon
        env:
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python ingest_hubspot_calls.py

      - name: Refresh HubSpot deals + contacts -> Neon
        env:
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python ingest_hubspot.py

      - name: Theme-tag new HubSpot call fiches (LLM)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: python tag_themes.py
